name: go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: make build clean-build
      - run: make fmt-check test race vet integration
      - run: make crane-integration
      - if: runner.os == 'Linux'
        run: make staticcheck
