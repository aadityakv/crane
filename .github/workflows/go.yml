name: go

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CRANE_TEST_TIME_SCALE: '3'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: make build clean-build
      - run: make fmt-check vet
      # The SWIM and Raft simulation suites drive real goroutines against an
      # injected clock and are timing-sensitive on shared runners; they get
      # exactly one retry so a scheduling hiccup does not fail the gate.
      - run: go test ./... -short -count=1 || go test ./internal/swim ./internal/raft -short -count=1
      - run: make integration
      - run: make staticcheck

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -race ./... -short -count=1 || go test -race ./internal/swim ./internal/raft -short -count=1
